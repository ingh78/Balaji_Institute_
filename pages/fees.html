<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fees - Balaji Institute</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .fees { padding: 30px; animation: slideUp 1s ease; }
    .fees ul { list-style: none; padding-left: 0; }
    .fees li { padding: 10px; border-bottom: 1px solid #ccc; }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="fees">
    <h1>💰 Course Fees</h1>
    <ul>
      <li>Tally – ₹4500</li>
      <li>Advanced Excel – ₹4500</li>
      <li>CPCT – ₹4000</li>
      <li>Advanced Tally – ₹4500</li>
    </ul>
  </div>
</body>
</html>
